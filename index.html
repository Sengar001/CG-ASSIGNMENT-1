<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Assignment</title>
    <style>
        canvas {
            border: 1px solid black;
            display: block;
            margin: 20px auto;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <!-- <h1>WebGL Shapes</h1> -->
    <p>Use <b>arrow keys</b> to move shapes, <b>'r'</b> to rotate, <b>'+'/'-'</b> to scale, <b>'s'</b> to make final shape, <b>'a'</b> to select all shapes</p>
    <button id="toggleCursor">Cursor Visibility</button>
    <button id="toggleMovement">Drawing</button>
    <button id="clearCanvas">Clear Canvas</button>
    <button id="increaseShapes">Increase Shape Limit</button>
    <p id="shapeCount">Max Shapes: 3</p>
    <canvas id="glCanvas" width="200" height="200"></canvas>
    <script type="module" src="main.js"></script>
</body>
</html>
