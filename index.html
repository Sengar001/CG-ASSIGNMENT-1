<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebGL Shape Editor</title>
    <style>
        canvas {
            border: 1px solid black;
            display: block;
            margin: 20px auto;
        }
        body {
            font-family: Arial, sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>WebGL Shape Editor</h1>
    <p>Use arrow keys to move shapes, 'r' to rotate, '+'/'-' to scale, 's' to make final shape.</p>
    <button id="toggleCursor">Toggle Cursor Visibility</button>
    <button id="toggleMovement">Toggle Cursor Movement</button>
    <button id="clearCanvas">Clear Canvas</button>
    
    <canvas id="glCanvas" width="200" height="200"></canvas>

    <script type="module" src="main.js"></script>
</body>
</html>
